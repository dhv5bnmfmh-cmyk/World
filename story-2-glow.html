<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>朗读体验</title></head><body><script>(async()=>{const html=await fetch('./story-2-v2.html?v=glow1').then(r=>r.text());const glow='<style id="glow-reader">.read-char.speaking{color:#fffdf0!important;background:transparent!important;text-shadow:0 0 6px rgba(255,250,205,.98),0 0 14px rgba(255,238,150,.82),0 0 24px rgba(255,224,120,.48),0 0 38px rgba(255,220,120,.28)!important;font-weight:400!important}</style>';document.open();document.write(html.replace('</head>',glow+'</head>'));document.close()})().catch(e=>{document.body.textContent='故事加载失败，请重新打开';console.error(e)});</script></body></html>
