<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>胡同：发光字朗读</title></head><body><script>(async()=>{const html=await fetch('./story-2-v2.html?v=glow3').then(r=>r.text());const glow='<style id="glow-reader">.read-char.speaking{color:#fffdf3!important;background:transparent!important;text-shadow:0 0 2px #fff,0 0 7px #fff4b8,0 0 15px #ffe88a,0 0 28px #ffc94d!important;filter:brightness(1.35);font-weight:400!important}</style>';const smooth='<script id="smooth-reader">(()=>{const native=window.scrollTo.bind(window);let target=null,raf=0;const ease=()=>{if(target===null){raf=0;return}const y=window.scrollY,d=target-y;if(Math.abs(d)<0.35){native(0,target);target=null;raf=0;return}native(0,y+d*.18);raf=requestAnimationFrame(ease)};window.scrollTo=(x,y)=>{if(typeof y!=="number")return native(x,y);target=y;if(!raf)raf=requestAnimationFrame(ease)}})()<\/script>';document.open();document.write(html.replace('</head>',glow+'</head>').replace('</body>',smooth+'</body>'));document.close()})().catch(e=>{document.body.textContent='故事加载失败，请重新打开';console.error(e)});</script></body></html>
