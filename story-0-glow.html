<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>紫禁城：发光字朗读</title><style>html,body{margin:0;background:#080b10;color:#f4f1e8}iframe{display:block;width:100%;height:100vh;border:0}</style></head><body><iframe id="story" src="./story-0-v2.html?reader=glow3" title="紫禁城故事"></iframe><script>const f=document.getElementById('story');f.addEventListener('load',()=>{try{const d=f.contentDocument,s=d.createElement('style');s.textContent='.read-char.speaking{color:#fffdf3!important;background:transparent!important;text-shadow:0 0 2px #fff,0 0 7px #fff4b8,0 0 15px #ffe88a,0 0 28px #ffc94d!important;filter:brightness(1.35);font-weight:400!important}#readerBox{gap:12px!important;padding:9px 12px!important}#readerBox button{min-width:42px;height:42px;padding:0 13px!important}#readerBox .play{min-width:48px!important;font-size:19px!important}';d.head.appendChild(s);const box=d.getElementById('readerBox');if(box){const play=d.getElementById('readBtn'),pause=d.getElementById('pauseBtn'),stop=d.getElementById('stopBtn');if(play&&pause&&stop){box.innerHTML='<button id="restartBtn" aria-label="重读">↺</button><button id="readBtn" class="play" aria-label="开始朗读">▶</button><button id="voiceBtn" aria-label="切换声音">◉</button>';const r=d.getElementById('readBtn'),restart=d.getElementById('restartBtn'),voice=d.getElementById('voiceBtn');const synth=d.defaultView.speechSynthesis;let running=false,pi=0,voiceIndex=0;const ps=[...d.querySelectorAll('.text p')].filter(p=>p.innerText.trim());const chars=ps.map(p=>[...p.querySelectorAll('.read-char')]);const clear=()=>chars.flat().forEach(x=>x.classList.remove('speaking'));const paint=(p,i)=>{const a=chars[p]||[];a.forEach((x,n)=>x.classList.toggle('speaking',n===i))};const go=()=>{if(!running)return;if(pi>=ps.length){running=false;r.textContent='▶';clear();return}const p=pi++,u=new SpeechSynthesisUtterance(ps[p].innerText);u.lang='zh-CN';u.rate=.92;const vs=synth.getVoices().filter(v=>/^zh/i.test(v.lang));if(vs.length)u.voice=vs[voiceIndex%vs.length];u.onstart=()=>{paint(p,0);follow(p)};u.onboundary=e=>{if(typeof e.charIndex==='number')paint(p,e.charIndex)};u.onend=()=>{if(running)setTimeout(go,120)};u.onerror=()=>{if(running)setTimeout(go,120)};synth.speak(u)};const follow=p=>{if(!running)return;const a=chars[p]||[];const x=a.find(z=>z.classList.contains('speaking'));if(x){const rr=x.getBoundingClientRect(),h=d.defaultView.innerHeight;if(rr.bottom>h*.72||rr.top<h*.25)x.scrollIntoView({behavior:'smooth',block:'center'})}d.defaultView.requestAnimationFrame(()=>follow(p))};const start=()=>{synth.cancel();clear();pi=0;running=true;r.textContent='■';go()};r.onclick=()=>{if(running){running=false;synth.cancel();clear();r.textContent='▶'}else start()};restart.onclick=start;voice.onclick=()=>{const vs=synth.getVoices().filter(v=>/^zh/i.test(v.lang));if(vs.length>1)voiceIndex=(voiceIndex+1)%vs.length};}}}catch(e){console.error(e)}});</script></body></html>
