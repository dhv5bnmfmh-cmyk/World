<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>紫禁城：发光字朗读</title></head><body><script>(async()=>{try{const html=await fetch('./story-0-v2.html?v=reader8').then(r=>r.text());const glow='<style id="glow-reader">.read-char.speaking{color:#fffdf3!important;background:transparent!important;text-shadow:0 0 2px #fff,0 0 7px #fff4b8,0 0 15px #ffe88a,0 0 28px #ffc94d!important;filter:brightness(1.35);font-weight:400!important}</style>';const fix='<style id="reader-ui">#readerBox{gap:12px!important;padding:9px 12px!important}#readerBox button{min-width:42px;height:42px;padding:0 13px!important}#readerBox .side{background:transparent!important;color:#f4f1e8!important;font-size:18px!important;padding:0 10px!important}#readerBox .play{min-width:48px!important;font-size:19px!important}</style><script id="reader-fix">(()=>{const boot=()=>{const oldPlay=document.getElementById("readBtn"),oldPause=document.getElementById("pauseBtn"),oldStop=document.getElementById("stopBtn");if(!oldPlay||!oldPause||!oldStop)return setTimeout(boot,30);const box=oldPlay.parentElement;box.innerHTML='<button id="restartBtn" class="side" aria-label="重读">↺</button><button id="readBtn" class="play" aria-label="开始朗读">▶</button><button id="voiceBtn" class="side" aria-label="切换声音">◉</button>';const readBtn=document.getElementById("readBtn"),restartBtn=document.getElementById("restartBtn"),voiceBtn=document.getElementById("voiceBtn"),synth=window.speechSynthesis,ps=[...document.querySelectorAll(".text p")].filter(p=>p.innerText.trim()),chars=ps.map(p=>[...p.querySelectorAll(".read-char")]);let pi=0,activeP=0,ci=0,running=false,paused=false,timerId=0,followId=0,start=0,duration=0,boundary=-1,voiceIndex=0;const clear=()=>chars.flat().forEach(x=>x.classList.remove("speaking"));const paint=(p,i)=>{const a=chars[p]||[];if(!a.length)return;ci=Math.max(0,Math.min(i,a.length-1));a.forEach((x,n)=>x.classList.toggle("speaking",n===ci))};const estimate=t=>Math.max(3.5,Math.min(32,[...t].length/4.35+(t.match(/[，。！？；：、,.!?;:]/g)||[]).length*.22));const stopLoops=()=>{if(timerId)cancelAnimationFrame(timerId);if(followId)cancelAnimationFrame(followId);timerId=followId=0};const follow=()=>{if(followId)cancelAnimationFrame(followId);const tick=()=>{if(!running||paused){followId=0;return}const x=(chars[activeP]||[])[ci];if(x){const r=x.getBoundingClientRect(),h=innerHeight;if(r.bottom>h*.68||r.top<h*.30){const target=scrollY+(r.bottom>h*.68?r.bottom-h*.68:r.top-h*.30),d=target-scrollY;if(Math.abs(d)>.8)scrollTo(0,scrollY+d*.035)}}followId=requestAnimationFrame(tick)};followId=requestAnimationFrame(tick)};const timer=p=>{if(timerId)cancelAnimationFrame(timerId);const total=chars[p].length,tick=now=>{if(!running||paused||!synth.speaking){timerId=0;return}const elapsed=Math.max(0,now-start),auto=Math.floor(Math.min(.999,elapsed/(duration*1000))*total),i=boundary>=0?Math.max(auto,boundary):auto;paint(p,i);timerId=requestAnimationFrame(tick)};timerId=requestAnimationFrame(tick)};const setState=state=>{if(state==='playing'){readBtn.textContent='■';readBtn.setAttribute('aria-label','停止朗读')}else readBtn.textContent='▶';};const voices=()=>synth.getVoices().filter(v=>/^zh/i.test(v.lang));const next=()=>{if(!running)return;if(pi>=ps.length){running=false;stopLoops();clear();setState('idle');return}const p=pi++;activeP=p;const text=ps[p].innerText;ci=0;boundary=-1;duration=estimate(text);start=performance.now();paint(p,0);const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.92;u.pitch=1;const vs=voices();if(vs.length)u.voice=vs[voiceIndex%vs.length];u.onstart=()=>{start=performance.now();timer(p);follow()};u.onboundary=e=>{if(typeof e.charIndex==='number'){boundary=e.charIndex;paint(p,boundary)}};u.onend=()=>{if(!running)return;paint(p,chars[p].length-1);if(p+1<ps.length)setTimeout(next,100);else{running=false;stopLoops();setState('idle')}};u.onerror=()=>{if(running)setTimeout(next,100)};synth.speak(u)};const startAll=()=>{synth.cancel();stopLoops();clear();pi=0;activeP=0;ci=0;running=true;paused=false;setState('playing');setTimeout(next,80)};readBtn.onclick=()=>{if(running){running=false;paused=false;synth.cancel();stopLoops();clear();setState('idle')}else startAll()};restartBtn.onclick=()=>startAll();voiceBtn.onclick=()=>{const vs=voices();if(vs.length>1)voiceIndex=(voiceIndex+1)%vs.length;if(running){synth.cancel();stopLoops();const savedP=activeP,savedC=ci;pi=savedP;running=true;setState('playing');setTimeout(next,80)}};synth.onvoiceschanged=()=>{};setState('idle')};boot()})()<\/script>';document.open();document.write(html.replace('</head>',glow+'</head>').replace('</body>',fix+'</body>'));document.close()}catch(e){document.body.textContent='故事加载失败，请重新打开';console.error(e)}})();</script></body></html>
