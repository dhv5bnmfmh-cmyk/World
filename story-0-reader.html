<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>紫禁城：墙里面的时间</title>
<style>
:root{--bg:#05070a;--fg:#fff;--dim:#aeb5c0;--glow:#fff4b8;--panel:#151a22ee}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{overflow:hidden}.reader{position:fixed;inset:0;background:#05070a;overflow:hidden}.bg{position:absolute;inset:-25px;background:var(--bgimg) center top/cover;filter:blur(22px);transform:scale(1.08);opacity:.35}.photo{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:contain;object-position:center top}.shade{position:absolute;z-index:2;inset:0;background:linear-gradient(180deg,#0001 25%,#0005 58%,#000d 100%);pointer-events:none}.back{position:absolute;z-index:20;top:calc(12px + env(safe-area-inset-top));left:14px;border:1px solid #ffffff22;border-radius:999px;background:#0d1016cc;color:#fff;padding:9px 14px;font-size:16px}.text{position:absolute;z-index:6;left:22px;right:22px;top:calc(47dvh + env(safe-area-inset-top));bottom:calc(115px + env(safe-area-inset-bottom));overflow:hidden;font-size:clamp(21px,5.5vw,29px);line-height:1.82;letter-spacing:.01em;text-shadow:0 2px 15px #000,0 1px 5px #000;scroll-behavior:auto}.para{margin:0 0 26px}.ch{display:inline;color:#fff;transition:color .04s,text-shadow .04s}.ch.done{color:#fff}.ch.current{color:#fff9c8;text-shadow:0 0 5px #fff,0 0 14px #ffe98a,0 0 28px #fff2a6,0 2px 12px #000}.ch.space{white-space:pre}.controls{position:absolute;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #ffffff1c;border-radius:28px;background:#151a22ee;box-shadow:0 12px 40px #0009;backdrop-filter:blur(18px);white-space:nowrap}.btn{border:0;border-radius:22px;min-width:46px;height:44px;background:#202732;color:#e8e9ed;font-size:18px}.play{min-width:58px;background:#eee5cb;color:#111;font-size:18px}.speed{min-width:54px;font-size:13px;font-weight:700}.voice{font-size:19px}.status{position:absolute;z-index:20;right:14px;top:calc(14px + env(safe-area-inset-top));color:#ffffffaa;font-size:11px;max-width:150px;text-align:right}.hint{position:absolute;z-index:8;left:22px;right:22px;top:calc(47dvh - 32px);color:#ffffff66;font-size:10px;text-align:center;pointer-events:none}
</style>
</head>
<body>
<main class="reader">
<button class="back" id="back">← 北京</button><div class="status" id="status">逐字同步</div>
<div class="bg" id="bg"></div><img class="photo" id="photo" alt="紫禁城"><div class="shade"></div>
<div class="hint">朗读时，当前字会逐字发光并平滑跟随</div>
<div class="text" id="text"></div>
<div class="controls">
<button class="btn" id="replay" aria-label="重读">↺</button>
<button class="btn speed" id="speed">1.0×</button>
<button class="btn play" id="play" aria-label="播放">▶</button>
<button class="btn voice" id="voice" aria-label="换声音">♬</button>
</div>
</main>
<script>
const STORY={title:'紫禁城：墙里面的时间',images:['https://commons.wikimedia.org/wiki/Special:Redirect/file/故宫博物院红墙_-_panoramio.jpg','https://commons.wikimedia.org/wiki/Special:Redirect/file/Gugong_Wumen_September_1984.jpg','https://commons.wikimedia.org/wiki/Special:Redirect/file/Gugong_Taihedian_September_1984.jpg','https://commons.wikimedia.org/wiki/Special:Redirect/file/Guardian_lion_(female)_of_the_Gate_of_Supreme_Harmony_2010_April.jpg','https://commons.wikimedia.org/wiki/Special:Redirect/file/Exhibition_of_architecture_of_the_Forbidden_City_stairs_2015_December.jpg'],body:['清晨，故宫的红墙还没有被游客填满。站在午门外，先看到的是墙，再往上看，才是黄色的屋顶。几百年前的人来到这里，也会先面对这道门。只是他们走进去的原因，与今天完全不同。','假如把时间拨回明清时期，一个普通的清晨并不会从“参观故宫”开始。宫门有自己的时间，朝会有自己的时间，仪式有自己的时间。有人负责开门，有人等待召见，有人准备车马，也有人已经在宫墙里的某个院落开始一天的工作。这里不是景点，而是一套正在运转的制度。','午门之后，空间突然变大。太和门、太和殿、中和殿、保和殿沿着中轴线依次展开。人在这样的尺度里很容易变得渺小。广场越大，建筑越高，人的位置就越清楚。这里的建筑并没有大声解释什么，却一直在告诉进入这里的人：什么地方最重要，谁应该站在哪里。','如果继续往里走，最值得注意的反而是那些看不见的规则。宫墙把空间切成一个个不同的区域。门不是单纯的门，它决定谁可以通过；道路也不是普通的道路，它可能对应某种身份和任务。对于皇帝、官员、宫女、太监和守卫来说，同一座宫城意味着完全不同的生活。','想象一个负责宫廷日常事务的人。他每天看到的可能不是太和殿宏大的正面，而是一道院门、一段回廊、一口井、一间房。历史书里不会记录这些普通的动作，但宫城真正能够持续运转，恰恰依靠无数这样的日常。有人送东西，有人打扫，有人传话，有人守门。宏大的历史背后，是非常具体的人。','再想象另一种时间。皇帝举行大典时，太和殿前的空间会突然改变意义。平时空旷的广场成为仪式的一部分，建筑、服饰、队列和声音共同组成秩序。对参加仪式的人来说，每一步都有位置。对今天的游客来说，这些地方只是可以走过的空间。相同的石板，却属于两个完全不同的世界。','明朝结束以后，宫城没有消失。清朝继续使用它。王朝改变了，制度和生活方式也发生变化，但宫门、宫殿和道路仍然留在北京的中心。后来清朝结束，紫禁城又失去了皇宫的身份。一个曾经只属于少数人的空间，逐渐成为公众可以进入的历史场所。','这也是故宫最耐人寻味的地方。建筑保存下来的不仅是形状，还有时间留下的层次。今天看见的一扇门，可能经历过不同朝代；今天站立的一座宫殿，曾经见证过不同的人和不同的决定。建筑没有告诉我们所有答案，却给历史留下了一个真实的现场。','所以走故宫的时候，不妨偶尔停下来，不看宫殿的正面，只看一段墙、一块石阶，或者一扇已经关闭的门。你会发现，历史并不总是宏大的。它也藏在谁能够通过这扇门、谁必须停在门外，以及一个普通人在这里度过怎样的一天。','离开故宫时，城市重新出现。汽车、地铁、人群和手机屏幕，把人带回今天的北京。身后的红墙看起来依旧安静。只是现在再回头看，它已经不只是一个古建筑的外壳，而像一层留在城市里的时间。过去的人曾经在墙里面生活，而今天的人走进去，是为了理解那个已经结束的世界。']};
const $=id=>document.getElementById(id),textEl=$('text'),playBtn=$('play'),speedBtn=$('speed'),voiceBtn=$('voice'),photo=$('photo'),bg=$('bg');
let spans=[],segments=[],seg=0,char=0,reading=false,paused=false,rate=1,voiceName='',raf=0,lastBoundary=-1,lastBoundaryTime=0,segStarted=0,token=0,lastPainted=-1,lastScrollAt=0;
const rates=[0.85,1,1.15,1.3,1.5];
function renderText(){textEl.innerHTML='';spans=[];segments=[];STORY.body.forEach((p,pi)=>{const pEl=document.createElement('p');pEl.className='para';[...p].forEach(c=>{const s=document.createElement('span');s.className='ch'+(c===' '?' space':'');s.textContent=c;pEl.appendChild(s);spans.push(s)});textEl.appendChild(pEl);segments.push({start:spans.length-STORY.body[pi].length,length:STORY.body[pi].length,text:STORY.body[pi]})})}
function getVoices(){return speechSynthesis.getVoices().filter(v=>/^zh-CN/i.test(v.lang));}
function chooseVoice(){const vs=getVoices();if(!vs.length)return null;if(voiceName){const v=vs.find(x=>x.name===voiceName);if(v)return v}return vs.find(v=>/Ting|普通话|Xiaoxiao|Yaoyao/i.test(v.name))||vs[0];}
function currentGlobal(){return segments[seg]?.start+char||0}
function setChar(globalIndex){if(!spans.length)return;globalIndex=Math.max(0,Math.min(spans.length-1,globalIndex));if(globalIndex===lastPainted)return;if(lastPainted>=0&&spans[lastPainted]){spans[lastPainted].classList.remove('current');if(lastPainted<globalIndex)spans[lastPainted].classList.add('done')}const cur=spans[globalIndex];if(cur){cur.classList.add('current');cur.classList.remove('done');const now=performance.now();const r=cur.getBoundingClientRect(),box=textEl.getBoundingClientRect();const target=box.top+box.height*.42;const delta=r.top-target;if(Math.abs(delta)>box.height*.10&&now-lastScrollAt>260){textEl.scrollTo({top:textEl.scrollTop+delta,behavior:'smooth'});lastScrollAt=now}}lastPainted=globalIndex}
function clearHighlight(){spans.forEach(s=>s.classList.remove('done','current'));lastPainted=-1;lastScrollAt=0;setChar(0)}
function speakSegment(index,fromChar=0){if(!reading)return;if(index>=segments.length){finish();return}seg=index;char=fromChar;lastBoundary=-1;lastBoundaryTime=performance.now();segStarted=performance.now();const sg=segments[index];const remaining=sg.text.slice(fromChar);setImage(index);setChar(sg.start+fromChar);const u=new SpeechSynthesisUtterance(remaining);u.lang='zh-CN';const v=chooseVoice();if(v)u.voice=v;u.rate=rate;u.pitch=1;u.volume=1;u.onstart=()=>{segStarted=performance.now()};u.onboundary=e=>{if(!reading||token!==activeToken)return;const idx=fromChar+(e.charIndex||0);if(idx>=fromChar&&idx<sg.length){char=idx;lastBoundary=idx;lastBoundaryTime=performance.now();setChar(sg.start+idx)}};u.onend=()=>{if(!reading||token!==activeToken)return;const elapsed=(performance.now()-segStarted)/1000;const cps=remaining.length/Math.max(.4,elapsed);adaptiveCps=adaptiveCps*.65+cps*.35;speakSegment(index+1,0)};u.onerror=()=>{if(reading&&token===activeToken)finish()};currentUtterance=u;speechSynthesis.speak(u);}
let currentUtterance=null,activeToken=0,adaptiveCps=4.35;
function tick(){cancelAnimationFrame(raf);if(reading&&!paused){const sg=segments[seg];if(sg&&speechSynthesis.speaking&&!speechSynthesis.paused){const elapsed=(performance.now()-segStarted)/1000;let local;if(lastBoundary>=0){const sinceBoundary=(performance.now()-lastBoundaryTime)/1000;local=lastBoundary+Math.floor(sinceBoundary*adaptiveCps*rate)}else{local=Math.floor(elapsed*adaptiveCps*rate)};char=Math.max(0,Math.min(sg.length-1,local));setChar(sg.start+char)}raf=requestAnimationFrame(tick)}}
function start(){if(!('speechSynthesis'in window))return;token++;activeToken=token;speechSynthesis.cancel();reading=true;paused=false;seg=0;char=0;adaptiveCps=4.35;clearHighlight();textEl.scrollTop=0;playBtn.textContent='Ⅱ';speakSegment(0,0);tick()}
function pause(){if(!reading)return;paused=true;const g=currentGlobal();speechSynthesis.pause();setChar(g);playBtn.textContent='▶';cancelAnimationFrame(raf)}
function resume(){if(!reading)return;paused=false;speechSynthesis.resume();playBtn.textContent='Ⅱ';tick()}
function toggle(){if(!reading){start();return}if(paused){resume();return}pause()}
function finish(){reading=false;paused=false;cancelAnimationFrame(raf);speechSynthesis.cancel();setChar(spans.length-1);playBtn.textContent='▶'}
function replay(){token++;speechSynthesis.cancel();reading=true;paused=false;seg=0;char=0;adaptiveCps=4.35;clearHighlight();textEl.scrollTop=0;playBtn.textContent='Ⅱ';activeToken=token;speakSegment(0,0);tick()}
function changeSpeed(){const n=rates.indexOf(rate);rate=rates[(n+1)%rates.length];speedBtn.textContent=rate.toFixed(2).replace(/0$/,'')+'×';if(reading&&!paused){const g=currentGlobal();token++;speechSynthesis.cancel();activeToken=token;const sg=segments[seg];speakSegment(seg,Math.max(0,Math.min(sg.length-1,g-sg.start)))}}
function changeVoice(){const vs=getVoices();if(!vs.length)return;const current=chooseVoice();let i=current?vs.findIndex(v=>v.name===current.name):-1;const next=vs[(i+1)%vs.length];voiceName=next.name;if(reading&&!paused){const g=currentGlobal();token++;speechSynthesis.cancel();activeToken=token;const sg=segments[seg];speakSegment(seg,Math.max(0,Math.min(sg.length-1,g-sg.start)))}}
function setImage(i){const no=Math.min(STORY.images.length-1,Math.floor(i/2));if(photo.dataset.no===String(no))return;photo.dataset.no=no;photo.src=STORY.images[no];bg.style.setProperty('--bgimg','url("'+STORY.images[no]+'")')}
renderText();setImage(0);clearHighlight();playBtn.onclick=toggle;speedBtn.onclick=changeSpeed;voiceBtn.onclick=changeVoice;$('replay').onclick=replay;$('back').onclick=()=>history.back();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{};
</script>
</body></html>
