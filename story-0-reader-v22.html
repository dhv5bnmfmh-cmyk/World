<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#080b10;overflow:hidden}</style><iframe id="page" src="./story-0-reader.html?v=22"></iframe><script>(()=>{const f=document.getElementById('page');f.onload=()=>{const d=f.contentDocument,w=f.contentWindow,s=w.speechSynthesis,ps=[...d.querySelectorAll('.text p')];let spans=[],p=0,c=0,state='idle',voices=[],vi=0,run=0;const old=d.getElementById('readerBox');if(old){const n=old.cloneNode(true);old.replaceWith(n)}const box=d.getElementById('readerBox'),R=d.getElementById('readBtn'),RR=d.getElementById('restartBtn'),V=d.getElementById('voiceBtn');d.querySelectorAll('.read-char').forEach(x=>x.classList.remove('speaking'));let css=d.createElement('style');css.textContent='.read-char{color:#f4f1e8!important;text-shadow:none!important;filter:none!important;transition:none!important}.read-char.speaking{animation:wordGlow .32s ease-out forwards;color:#fffef5!important;font-weight:500}@keyframes wordGlow{0%{color:#f4f1e8;filter:brightness(1);text-shadow:none}35%{color:#fffefb;filter:brightness(1.18);text-shadow:0 0 2px #fff,0 0 5px #ffe98a}100%{color:#fffef5;filter:brightness(1.42);text-shadow:0 0 2px #fff,0 0 8px #fff2a6,0 0 16px #ffd84d}}';d.head.appendChild(css);spans=ps.map(x=>[...x.querySelectorAll('.read-char')]);function load(){voices=s.getVoices().filter(v=>/^zh/i.test(v.lang)||/Chinese|中文|普通话|Mandarin/i.test(v.name));if(!voices.length)voices=s.getVoices()}load();s.onvoiceschanged=load;function clear(){spans.flat().forEach(x=>x.classList.remove('speaking'))}function mark(n){let a=spans[p];if(!a?.length)return;n=Math.max(0,Math.min(n,a.length-1));if(n===c&&a[c]?.classList.contains('speaking'))return;c=n;a.forEach(x=>x.classList.remove('speaking'));void a[c].offsetWidth;a[c].classList.add('speaking');const r=a[c].getBoundingClientRect();if(r.top<innerHeight*.27||r.bottom>innerHeight*.72)a[c].scrollIntoView({behavior:'smooth',block:'center'})}function speak(pp,start){if(state!=='playing')return;if(pp>=spans.length){state='idle';clear();R.textContent='▶';return}p=pp;c=start||0;const text=ps[p].innerText.slice(c),id=++run,u=new w.SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.94;let vs=voices.length?voices:s.getVoices();if(vs.length)u.voice=vs[vi%vs.length];u.onstart=()=>{if(id===run)mark(c)};u.onboundary=e=>{if(id!==run||state!=='playing'||typeof e.charIndex!=='number')return;const n=c+e.charIndex;if(n>c)mark(n)};u.onend=()=>{if(id!==run||state!=='playing')return;mark(spans[p].length-1);setTimeout(()=>speak(p+1,0),120)};u.onerror=()=>{if(id===run&&state==='playing')setTimeout(()=>speak(p,c),100)};s.speak(u)}R.onclick=()=>{if(state==='idle'){state='playing';R.textContent='■';speak(p,c)}else if(state==='playing'){state='paused';run++;s.cancel();R.textContent='▶'}else{state='playing';R.textContent='■';speak(p,c)}};RR.onclick=()=>{run++;s.cancel();state='playing';p=c=0;clear();w.scrollTo({top:0,behavior:'smooth'});R.textContent='■';setTimeout(()=>speak(0,0),80)};V.onclick=()=>{load();if(!voices.length)return;vi=(vi+1)%voices.length;if(state==='playing'){const pp=p,cc=c;run++;s.cancel();setTimeout(()=>speak(pp,cc),70)}};R.textContent='▶'};})();</script>
