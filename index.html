<body>

<script>
const stories=[
{type:"北京 · 宫城",title:"紫禁城：墙里面的时间",source:"故宫博物院 · 明清北京",body:[
"如果第一次来到北京，很多人会从天安门广场走向故宫。穿过午门之后，城市的声音突然像被一扇门关在身后。眼前是一片开阔的空间，红墙、金瓦、石阶和一座座宫殿沿着南北中轴线展开。这里曾经是明清两代皇宫，也是北京城最重要的空间之一。",
"今天的故宫看起来安静，但在几百年前，这里从来不是一座安静的建筑群。它是一座严格按照等级和秩序运行的宫城。什么人可以进入哪一道门，什么时候举行仪式，谁站在哪里，甚至不同身份的人应该经过什么路线，都有明确的规则。建筑本身，就像一张被固定下来的城市秩序图。",
"这种秩序首先体现在中轴线上。午门之后，是太和门、太和殿、中和殿、保和殿。越往里面走，空间越显得庄严。巨大的广场让人的身体显得很小，而一层层抬高的台基，又让主要建筑拥有非常明确的视觉中心。站在其中，人很容易理解为什么古代宫殿建筑不仅是在解决居住问题，也是在表达权力、礼仪和等级。",
"但如果只把故宫看成皇帝居住和办公的地方，就会错过它最有意思的一面。这里曾经生活着大量不同身份的人。皇帝在这里处理政务，官员在特定时间进入宫城，宫女和太监负责日常生活，守卫负责安全。不同的人拥有不同的活动范围。一道门、一面墙、一个院落，都可能意味着身份的区别。",
"对于生活在这里的人来说，时间也有自己的规则。早晨什么时候开始一天的工作，什么时候举行朝会，什么时候进行仪式，都与季节、礼制和宫廷制度联系在一起。今天游客可以自由地从一座宫殿走到另一座宫殿，但过去的人并不能这样随意穿行。我们脚下看似普通的道路，曾经承载着非常严格的行动路线。",
"紫禁城的颜色也在讲述这种秩序。红色的宫墙、黄色的琉璃瓦、白色的石台和深色的门窗，共同形成了今天人们熟悉的故宫形象。它并不是某一个设计师一次完成的作品，而是在长期使用、维修和改建中逐渐形成的宫城。建筑留下的不只是美感，也留下了不断变化的历史。",
"明朝灭亡之后，清朝继续使用这座宫城。王朝更替了，但宫殿、城门和道路仍然继续承担原来的功能。后来清朝结束，紫禁城又经历了新的时代。它不再是皇宫，而逐渐成为今天人们认识中国历史的重要场所。一个空间的身份，就这样随着时代发生了变化。",
"最有意思的地方也许就在这里。今天站在太和殿前，我们看到的是古建筑，但如果把时间往回推几百年，这里看到的会是完全不同的世界。有人在等待召见，有人在准备仪式，有人负责守卫，有人在宫墙里的某个院落开始一天的工作。建筑没有移动，但使用它的人、他们的生活方式，以及他们理解世界的方式，都已经改变。",
"所以故宫真正保存下来的，不只是宫殿。它还保存了一种古代城市如何组织权力、空间和人的生活方式。宫墙把一个时代留在了北京的中心，也让后来的人有机会从建筑进入历史。",
"今天离开故宫，再回头看那一道道红墙，会发现它已经不再只是皇宫的边界。它成为一扇通向过去的门。我们走进这里，看见的不只是太和殿、御花园和宫墙，也是在看一个曾经真实运转过的世界。墙还在那里，但墙里面的时间，已经成为所有来到这里的人都可以阅读的历史。"]},
{type:"北京 · 前门",title:"前门：城门外的北京",source:"前门地区 · 北京城市生活",body:[
"如果故宫让人看到北京城里最庄严的一面，那么前门让人看到的，是城门之外更热闹、更具体的北京。过去，从这里进出的人很多，商人、旅客、车夫、小贩和普通居民，都在这片区域留下过自己的脚步。前门因此不只是一个地名，也是一座城市生活的入口。",
"今天我们说前门，通常会想到正阳门、前门大街以及周围的老字号。但在更早的时候，这里首先是一组城市防御与交通空间。北京城有完整的城墙和城门体系，城门控制着城市与城外之间的往来。正阳门位于内城南面，在历史上的交通和礼仪活动中都有重要位置。",
"城门本身很高大，但真正让前门形成城市气质的，是门外不断聚集的人。道路把城内外连接起来，人流带来交易，交易又带来店铺和服务。久而久之，前门附近形成了密集的商业活动。茶馆、饭庄、旅店、药铺以及各种手工业和服务行业，都曾在这里出现。",
"一座城市的商业区，往往比宫殿更能让人看到普通人的生活。有人一早推着货物进城，有人站在店门口招呼客人，有人为了赶路在这里短暂停留，也有人在这里工作了一辈子。对于这些人来说，前门不是历史书里的古迹，而是每天都要经过的一条街。",
"前门还有一个特别的地方，就是它把北京的不同空间连接在一起。向北走，可以进入城市的核心区域；向南，则逐渐接近城外和更广阔的道路。这样的地理位置让这里长期保持着很强的人流。城市越发展，前门越容易成为不同身份、不同目的的人相遇的地方。",
"商业也会随着时代变化。新的交通方式出现以后，人们到达城市的速度改变了；新的商业中心出现以后，消费习惯也发生了变化。前门经历过繁华，也经历过改造和沉寂。街道上的店铺会换名字，建筑会维修，人群会改变，但城市生活留下的痕迹并不会轻易消失。",
"今天走在前门大街，看到的建筑有些经过修复，有些重新经营。游客可能是为了老字号而来，也可能只是想看看北京传统街区的样子。但如果慢下来观察，就会发现这里真正值得看的并不只是牌匾和建筑，而是街道与人的关系。",
"一条街什么时候开始热闹，什么样的店铺会留下来，哪些人愿意在这里生活和工作，这些看起来很普通的问题，其实一直在塑造城市。前门的历史，就是这样一层一层积累起来的。",
"所以，前门可以被看作故宫之外的另一扇北京之门。故宫让人理解过去的宫廷与秩序，前门则让人理解城市里的商业、交通和普通人的生活。一个城市真正的生命力，不只存在于最高大的建筑里，也存在于每天有人买东西、吃饭、赶路、聊天的街道上。",
"当夜晚的灯亮起来，前门又变成另一种样子。建筑的轮廓留在街道两侧，人群从中间经过。几百年前的人已经离开，但他们曾经使用过的道路、形成过的商业传统，以及这座城市不断变化的生活方式，仍然可以从这里找到一点线索。前门真正保存的，也许不是某一间店，而是北京一直没有停止的城市生活。"]},
{type:"北京 · 胡同",title:"胡同：一座城市的日常",source:"北京胡同地区 · 城市生活",body:[
"北京最容易让人记住的，也许不是一座宫殿，而是一条并不起眼的胡同。两边是院墙和院门，路不算宽，清晨有人买菜，下午有人聊天，孩子从巷子里跑过去，家家户户的生活声音交织在一起。对于一座有着漫长历史的城市来说，胡同保存的是最普通、也最接近人的一面。",
"胡同并不是简单的一条小路。它与北京传统城市的整体规划有关系。很多胡同连接着成片的院落，院落又组成街区。道路、院门和房屋的位置形成一种稳定的城市结构。站在胡同里，人很难看到整座城市，但可以通过一条街、一扇门和一个院子，感受到城市是怎样被生活填满的。",
"北京传统民居中很有代表性的一种形式是四合院。几座房屋围绕一个院子排列，院子成为家庭生活的重要空间。不同房间有不同用途，不同家庭成员也可能拥有不同的位置。这样的住宅不仅解决居住问题，也把家庭关系、生活习惯和空间安排联系在一起。",
"胡同最有意思的地方，是公共空间和私人生活之间的距离很近。院门里面是家庭，院门外就是邻里共同使用的街道。谁家来了客人，哪家正在搬东西，哪家的孩子在门口玩耍，很多事情都很容易被邻居看见。人与人之间的关系，因此会自然地进入日常生活。",
"这种生活方式也形成了北京独特的声音。自行车经过的声音，院门打开的声音，邻居聊天的声音，街边小贩的叫卖声，还有夏天从院子里传出来的生活声。它们没有被写进建筑说明牌，却是一个街区最真实的记忆。",
"胡同里的生活也并不是一成不变。人口增加、城市建设、交通变化和住房需求，都曾改变北京的街区。很多胡同消失了，也有一些经过保护和修缮继续存在。今天的人走进老胡同，看到的可能已经不是几十年前的完整生活，但仍然可以从空间里找到过去留下的痕迹。",
"一扇旧门可能已经换了颜色，一面墙可能经过修补，一座院子可能已经改变用途。建筑看起来没有以前那么完整，却反而提醒人们，城市不是博物馆。真正的城市会被人使用，也会被人的生活不断改变。",
"如果只从著名景点认识北京，很容易把这座城市理解成一组宫殿、城门和纪念建筑。但沿着胡同走一段路，会发现另一种北京。这里没有巨大的广场，也没有宏伟的宫殿，却有很多人与人之间非常具体的关系。",
"一个老人坐在门口晒太阳，一家人准备晚饭，孩子放学后经过巷口，邻居停下来聊几句话。这些事情看起来都很普通，却正是城市最重要的组成部分。历史并不总是发生在重要人物身上，也发生在无数普通人的一天里。",
"所以胡同真正保存的，不只是老房子。它保存的是一种城市生活的尺度：人可以走路认识邻居，可以在门口停下来，可以听见街道的声音，也可以从一条小路进入更大的城市。",
"今天，北京仍然在变化。新的建筑、新的道路和新的生活方式不断出现，而胡同也在寻找自己在现代城市里的位置。它们提醒人们，一座城市除了不断向前，也可以保留一些让人慢下来观察生活的地方。",
"当你走出胡同重新回到宽阔的北京街道，会发现刚才看到的那个小小世界并没有真正消失。它只是藏在城市更大的结构里面。理解北京，有时候不需要从最宏伟的建筑开始。一条胡同、一座院子和一天普通人的生活，同样可以成为认识这座城市的入口。"]}];
let current=0,utterance=null,timer=null,startedAt=0,totalSeconds=0;
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');stopSpeak();scrollTo(0,0)}
function openStory(i){current=i;render();show('reader')}
function render(){const s=stories[current];storyType.textContent=s.type;storyTitle.textContent=s.title;storySource.textContent=s.source;storyBody.innerHTML=s.body.map(p=>'<p>'+p+'</p>').join('');audioTitle.textContent=s.title;resetAudio()}
function estimateDuration(text){return Math.max(25,Math.round(text.length/3.2))}
function formatTime(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function resetAudio(){clearInterval(timer);timer=null;audioProgress.style.width='0%';audioElapsed.textContent='0:00';totalSeconds=estimateDuration(stories[current].body.join(''));audioDuration.textContent=formatTime(totalSeconds);audioButton.textContent='▶'}
function toggleSpeak(){
  if(speechSynthesis.speaking && !speechSynthesis.paused){speechSynthesis.pause();audioButton.textContent='▶';return}
  if(speechSynthesis.paused){speechSynthesis.resume();audioButton.textContent='Ⅱ';return}
  speak();
}
function speak(){
  stopSpeak();
  const s=stories[current],text=s.body.join('');
  utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-CN';utterance.rate=.92;
  startedAt=Date.now();audioButton.textContent='Ⅱ';
  utterance.onboundary=e=>{if(e.charIndex>=0){const p=Math.min(99,e.charIndex/text.length*100);audioProgress.style.width=p+'%';audioElapsed.textContent=formatTime(totalSeconds*p/100)}};
  utterance.onend=()=>{audioProgress.style.width='100%';audioElapsed.textContent=formatTime(totalSeconds);audioButton.textContent='▶';clearInterval(timer);timer=null};
  utterance.onerror=()=>{audioButton.textContent='▶';clearInterval(timer);timer=null};
  speechSynthesis.speak(utterance);
  clearInterval(timer);
  timer=setInterval(()=>{if(speechSynthesis.speaking&&!speechSynthesis.paused){const p=Math.min(99,(Date.now()-startedAt)/1000/totalSeconds*100);audioProgress.style.width=p+'%';audioElapsed.textContent=formatTime((Date.now()-startedAt)/1000)}},500);
}
function stopSpeak(){speechSynthesis.cancel();clearInterval(timer);timer=null;audioButton.textContent='▶';audioProgress.style.width='0%';audioElapsed.textContent='0:00'}
function replaySpeak(){speak()}
function changeVoice(){alert('声音切换将在下一版加入。')}
function toggleLang(){alert('English interface will be added after the Chinese MVP.')}
</script>
</body></html>
