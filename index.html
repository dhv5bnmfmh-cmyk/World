<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>世界文化探索</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1016;color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit}
.app{min-height:100vh;max-width:1100px;margin:auto;background:radial-gradient(circle at 50% 0,#26344b 0,#0d1016 42%);padding:22px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:13px;letter-spacing:3px;color:#b8aa88}.lang{border:1px solid #3a4352;background:#151a23;color:#ddd8ca;border-radius:20px;padding:7px 12px}
h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:28px 0 12px}.sub{color:#aeb5c0;max-width:650px;line-height:1.8}
.world{position:relative;margin:28px 0;border:1px solid #303949;border-radius:28px;min-height:430px;overflow:hidden;background:linear-gradient(180deg,#172233,#10151d)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px}
.orbit{position:absolute;border:1px solid #6f7d8e33;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.o1{width:260px;height:260px}.o2{width:430px;height:430px}.o3{width:620px;height:620px}
.earth{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:155px;height:155px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6c9f9b,#294f57 45%,#142e38 75%);box-shadow:0 0 70px #4d8d9344}
.node{position:absolute;transform:translate(-50%,-50%);border:1px solid #657184;background:#151b25dd;color:#f6f1e5;border-radius:999px;padding:10px 15px;cursor:pointer}.china{left:68%;top:36%}.japan{left:80%;top:52%}.europe{left:38%;top:27%}.usa{left:20%;top:46%}
.panel{display:none}.panel.active{display:block}.back{background:none;border:0;color:#b8aa88;padding:0 0 15px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#151a22;border:1px solid #2c3441;border-radius:20px;padding:20px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#81785f}.eyebrow{font-size:12px;color:#9d9277;letter-spacing:2px}.card h3{margin:9px 0 0;font-size:24px}.card p{display:none}
.reader{max-width:820px}.story{font-size:clamp(21px,4.5vw,31px);line-height:1.95;color:#eee9dc;margin:48px 0}.story p{margin:0 0 1.4em}.meta{color:#9da5b1;font-size:13px;line-height:1.7}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{background:#e8dfc7;color:#151515;border:0;border-radius:12px;padding:10px 14px}.controls button.secondary{background:#202732;color:#ddd;border:1px solid #364050}
.small{font-size:12px;color:#7f8997;margin-top:24px}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">WORLD · 世界文化探索</div><button class="lang" onclick="toggleLang()">中 / EN</button></header>

<section id="home" class="panel active">
<h1>从一个地方，<br>认识一个世界。</h1>
<div class="world">
<div class="grid"></div><div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="earth"></div>
<button class="node china" onclick="show('china')">🇨🇳 中国</button><button class="node japan">🇯🇵 日本</button><button class="node europe">🇪🇺 欧洲</button><button class="node usa">🇺🇸 美国</button>
</div>
</section>

<section id="china" class="panel">
<button class="back" onclick="show('home')">← 世界</button><h1>中国</h1>
<div class="cards"><article class="card" onclick="show('beijing')"><div class="eyebrow">01 · 首都</div><h3>北京</h3></article><article class="card"><div class="eyebrow">COMING SOON</div><h3>更多城市</h3></article></div>
</section>

<section id="beijing" class="panel">
<button class="back" onclick="show('china')">← 中国</button><h1>北京</h1>
<div class="cards">
<article class="card" onclick="openStory(0)"><div class="eyebrow">宫城 · 时间</div><h3>紫禁城：墙里面的时间</h3></article>
<article class="card" onclick="openStory(1)"><div class="eyebrow">城市 · 前门</div><h3>前门：城门外的北京</h3></article>
<article class="card" onclick="openStory(2)"><div class="eyebrow">生活 · 胡同</div><h3>胡同：一座城市的日常</h3></article>
</div>
</section>

<section id="reader" class="panel reader">
<button class="back" onclick="show('beijing')">← 北京</button>
<div class="eyebrow" id="storyType"></div><h1 id="storyTitle"></h1><p class="meta" id="storySource"></p>
<article class="story" id="storyBody"></article>
<div class="controls"><button onclick="speak()">🔊 听故事</button><button class="secondary" onclick="stopSpeak()">停止</button></div>
</section>
</main>
<script>
const stories=[
{type:"北京 · 宫城",title:"紫禁城：墙里面的时间",source:"故宫博物院 · 明清北京",body:[
"北京的中心，曾经有一座巨大的宫城。几百年来，宫墙把这里与普通人的城市生活分开。今天，我们称它为故宫。",
"沿着中轴线进入宫城，午门、太和门、太和殿一层层展开。巨大的广场、层层抬高的台基，以及整齐的建筑排列，让人很容易感受到这里曾经拥有的秩序。",
"但紫禁城真正有意思的地方，不只是建筑有多大，而是墙里面曾经发生过什么。每天什么时候开门，谁可以进入哪一道门，什么人在什么地方停留，都有严格的规则。",
"皇帝、官员、宫女、太监和守卫，在这片空间里拥有不同的位置。对他们来说，这不是今天的旅游景点，而是一座持续运转的城市。",
"宫墙也把时间保存了下来。明朝和清朝已经成为历史，但门、殿、道路和院落仍然留在原来的城市中心。我们今天走过这里，看见的不只是古建筑，也是在看一座城市曾经如何安排权力、礼仪与人的生活。",
"站在故宫的高处回望北京，会发现一个很有意思的变化：过去，宫城是城市权力的中心；今天，它变成了人们认识北京历史的一扇门。墙还在，但墙里面的时间，已经属于所有来到这里的人。"]},
{type:"北京 · 前门",title:"前门：城门外的北京",source:"前门地区 · 北京城市生活",body:["前门曾是北京重要的城市门户。城门、街道、商铺和来往的人，共同形成了这里独特的城市生活。","今天走过前门，仍能从街道和建筑中看到北京商业与交通留下的痕迹。"]},
{type:"北京 · 胡同",title:"胡同：一座城市的日常",source:"北京胡同地区 · 城市生活",body:["如果宫城代表北京的宏大秩序，那么胡同更接近普通人的日常。院门、街巷、邻里和声音，组成了另一种城市记忆。","理解北京，有时候不需要站在最著名的建筑前。一条普通胡同，也可以成为认识这座城市的入口。"]}
];
let current=0;
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');stopSpeak();scrollTo(0,0)}
function openStory(i){current=i;render();show('reader')}
function render(){const s=stories[current];storyType.textContent=s.type;storyTitle.textContent=s.title;storySource.textContent=s.source;storyBody.innerHTML=s.body.map(p=>'<p>'+p+'</p>').join('')}
function speak(){stopSpeak();const s=stories[current];const u=new SpeechSynthesisUtterance(s.body.join(''));u.lang='zh-CN';u.rate=.92;speechSynthesis.speak(u)}
function stopSpeak(){speechSynthesis.cancel()}
function toggleLang(){alert('English interface will be added after the Chinese MVP.')}
</script>
</body></html>
