<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>世界文化探索</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1016;color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit}
.app{min-height:100vh;max-width:1100px;margin:auto;background:radial-gradient(circle at 50% 0,#26344b 0,#0d1016 42%);padding:18px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:12px;letter-spacing:2.5px;color:#b8aa88}.lang{border:1px solid #3a4352;background:#151a23;color:#ddd8ca;border-radius:20px;padding:6px 11px}
h1{font-size:clamp(28px,6vw,48px);line-height:1.1;margin:22px 0 10px}.sub{color:#aeb5c0;max-width:650px;line-height:1.8}
.world{position:relative;margin:24px 0;border:1px solid #303949;border-radius:24px;min-height:430px;overflow:hidden;background:linear-gradient(180deg,#172233,#10151d)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px}
.orbit{position:absolute;border:1px solid #6f7d8e33;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.o1{width:260px;height:260px}.o2{width:430px;height:430px}.o3{width:620px;height:620px}
.earth{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:155px;height:155px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6c9f9b,#294f57 45%,#142e38 75%);box-shadow:0 0 70px #4d8d9344}
.node{position:absolute;transform:translate(-50%,-50%);border:1px solid #657184;background:#151b25dd;color:#f6f1e5;border-radius:999px;padding:9px 13px;cursor:pointer;font-size:14px}.china{left:68%;top:36%}.japan{left:80%;top:52%}.europe{left:38%;top:27%}.usa{left:20%;top:46%}
.panel{display:none}.panel.active{display:block}.back{background:none;border:0;color:#b8aa88;padding:0 0 12px;cursor:pointer;font-size:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#151a22;border:1px solid #2c3441;border-radius:18px;padding:17px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#81785f}.eyebrow{font-size:11px;color:#9d9277;letter-spacing:1.7px}.card h3{margin:8px 0 0;font-size:20px;line-height:1.35}.card p{display:none}
.reader{max-width:820px;padding-bottom:132px}.reader h1{font-size:clamp(27px,5.8vw,42px);margin:14px 0 8px}.story{font-size:clamp(17px,3.7vw,23px);line-height:1.9;color:#eee9dc;margin:30px 0}.story p{margin:0 0 1.35em}.meta{color:#9da5b1;font-size:12px;line-height:1.7}
.audio-player{position:fixed;z-index:30;left:10px;right:10px;bottom:10px;padding:11px 12px calc(11px + env(safe-area-inset-bottom));background:#151a22eF;border:1px solid #ffffff16;border-radius:18px;box-shadow:0 10px 35px #0008;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.audio-top{display:flex;align-items:center;gap:10px}.audio-art{width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#d9cfb2,#81785f);font-size:20px}.audio-info{min-width:0;flex:1}.audio-label{font-size:10px;letter-spacing:1.3px;color:#9d9277;margin-bottom:3px}.audio-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eee9dc}.audio-button{width:40px;height:40px;border:0;border-radius:50%;background:#e8dfc7;color:#151515;display:grid;place-items:center;font-size:17px;flex:0 0 40px}.audio-stop{width:34px;height:34px;border:1px solid #364050;border-radius:50%;background:#202732;color:#cfd3da;font-size:13px;flex:0 0 34px}.audio-progress{height:3px;background:#3a414d;border-radius:99px;margin:10px 2px 0;overflow:hidden}.audio-progress i{display:block;width:0;height:100%;background:#e8dfc7;border-radius:99px;transition:width .15s linear}.audio-time{display:flex;justify-content:space-between;color:#7f8997;font-size:10px;margin:4px 2px 0}
.small{font-size:12px;color:#7f8997;margin-top:24px}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">WORLD · 世界文化探索</div><button class="lang" onclick="toggleLang()">中 / EN</button></header>

<section id="home" class="panel active">
<h1>从一个地方，<br>认识一个世界。</h1>
<div class="world">
<div class="grid"></div><div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="earth"></div>
<button class="node china" onclick="show('china')">🇨🇳 中国</button><button class="node japan">🇯🇵 日本</button><button class="node europe">🇪🇺 欧洲</button><button class="node usa">🇺🇸 美国</button>
</div>
</section>

<section id="china" class="panel">
<button class="back" onclick="show('home')">← 世界</button><h1>中国</h1>
<div class="cards"><article class="card" onclick="show('beijing')"><div class="eyebrow">01 · 首都</div><h3>北京</h3></article><article class="card"><div class="eyebrow">COMING SOON</div><h3>更多城市</h3></article></div>
</section>

<section id="beijing" class="panel">
<button class="back" onclick="show('china')">← 中国</button><h1>北京</h1>
<div class="cards">
<article class="card" onclick="openStory(0)"><div class="eyebrow">宫城 · 时间</div><h3>紫禁城：墙里面的时间</h3></article>
<article class="card" onclick="openStory(1)"><div class="eyebrow">城市 · 前门</div><h3>前门：城门外的北京</h3></article>
<article class="card" onclick="openStory(2)"><div class="eyebrow">生活 · 胡同</div><h3>胡同：一座城市的日常</h3></article>
</div>
</section>

<section id="reader" class="panel reader">
<button class="back" onclick="show('beijing')">← 北京</button>
<div class="eyebrow" id="storyType"></div><h1 id="storyTitle"></h1><p class="meta" id="storySource"></p>
<article class="story" id="storyBody"></article>
<div class="audio-player">
  <div class="audio-top">
    <div class="audio-art">🎧</div>
    <div class="audio-info"><div class="audio-label">正在朗读</div><div class="audio-title" id="audioTitle">紫禁城：墙里面的时间</div></div>
    <button class="audio-stop" onclick="stopSpeak()" aria-label="停止朗读">■</button>
    <button class="audio-button" id="audioButton" onclick="toggleSpeak()" aria-label="播放">▶</button>
  </div>
  <div class="audio-progress"><i id="audioProgress"></i></div>
  <div class="audio-time"><span id="audioElapsed">0:00</span><span id="audioDuration">--:--</span></div>
</div>
</section>
</main>
<script>
const stories=[
{type:"北京 · 宫城",title:"紫禁城：墙里面的时间",source:"故宫博物院 · 明清北京",body:[
"如果第一次来到北京，很多人会从天安门广场走向故宫。穿过午门之后，城市的声音突然像被一扇门关在身后。眼前是一片开阔的空间，红墙、金瓦、石阶和一座座宫殿沿着南北中轴线展开。这里曾经是明清两代皇宫，也是北京城最重要的空间之一。",
"今天的故宫看起来安静，但在几百年前，这里从来不是一座安静的建筑群。它是一座严格按照等级和秩序运行的宫城。什么人可以进入哪一道门，什么时候举行仪式，谁站在哪里，甚至不同身份的人应该经过什么路线，都有明确的规则。建筑本身，就像一张被固定下来的城市秩序图。",
"这种秩序首先体现在中轴线上。午门之后，是太和门、太和殿、中和殿、保和殿。越往里面走，空间越显得庄严。巨大的广场让人的身体显得很小，而一层层抬高的台基，又让主要建筑拥有非常明确的视觉中心。站在其中，人很容易理解为什么古代宫殿建筑不仅是在解决居住问题，也是在表达权力、礼仪和等级。",
"但如果只把故宫看成皇帝居住和办公的地方，就会错过它最有意思的一面。这里曾经生活着大量不同身份的人。皇帝在这里处理政务，官员在特定时间进入宫城，宫女和太监负责日常生活，守卫负责安全。不同的人拥有不同的活动范围。一道门、一面墙、一个院落，都可能意味着身份的区别。",
"对于生活在这里的人来说，时间也有自己的规则。早晨什么时候开始一天的工作，什么时候举行朝会，什么时候进行仪式，都与季节、礼制和宫廷制度联系在一起。今天游客可以自由地从一座宫殿走到另一座宫殿，但过去的人并不能这样随意穿行。我们脚下看似普通的道路，曾经承载着非常严格的行动路线。",
"紫禁城的颜色也在讲述这种秩序。红色的宫墙、黄色的琉璃瓦、白色的石台和深色的门窗，共同形成了今天人们熟悉的故宫形象。它并不是某一个设计师一次完成的作品，而是在长期使用、维修和改建中逐渐形成的宫城。建筑留下的不只是美感，也留下了不断变化的历史。",
"明朝灭亡之后，清朝继续使用这座宫城。王朝更替了，但宫殿、城门和道路仍然继续承担原来的功能。后来清朝结束，紫禁城又经历了新的时代。它不再是皇宫，而逐渐成为今天人们认识中国历史的重要场所。一个空间的身份，就这样随着时代发生了变化。",
"最有意思的地方也许就在这里。今天站在太和殿前，我们看到的是古建筑，但如果把时间往回推几百年，这里看到的会是完全不同的世界。有人在等待召见，有人在准备仪式，有人负责守卫，有人在宫墙里的某个院落开始一天的工作。建筑没有移动，但使用它的人、他们的生活方式，以及他们理解世界的方式，都已经改变。",
"所以故宫真正保存下来的，不只是宫殿。它还保存了一种古代城市如何组织权力、空间和人的生活方式。宫墙把一个时代留在了北京的中心，也让后来的人有机会从建筑进入历史。",
"今天离开故宫，再回头看那一道道红墙，会发现它已经不再只是皇宫的边界。它成为一扇通向过去的门。我们走进这里，看见的不只是太和殿、御花园和宫墙，也是在看一个曾经真实运转过的世界。墙还在那里，但墙里面的时间，已经成为所有来到这里的人都可以阅读的历史。"]},
{type:"北京 · 前门",title:"前门：城门外的北京",source:"前门地区 · 北京城市生活",body:["前门曾是北京重要的城市门户。城门、街道、商铺和来往的人，共同形成了这里独特的城市生活。","今天走过前门，仍能从街道和建筑中看到北京商业与交通留下的痕迹。"]},
{type:"北京 · 胡同",title:"胡同：一座城市的日常",source:"北京胡同地区 · 城市生活",body:["如果宫城代表北京的宏大秩序，那么胡同更接近普通人的日常。院门、街巷、邻里和声音，组成了另一种城市记忆。","理解北京，有时候不需要站在最著名的建筑前。一条普通胡同，也可以成为认识这座城市的入口。"]}];
let current=0,utterance=null,timer=null,startedAt=0,totalSeconds=0;
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');stopSpeak();scrollTo(0,0)}
function openStory(i){current=i;render();show('reader')}
function render(){const s=stories[current];storyType.textContent=s.type;storyTitle.textContent=s.title;storySource.textContent=s.source;storyBody.innerHTML=s.body.map(p=>'<p>'+p+'</p>').join('');audioTitle.textContent=s.title;resetAudio()}
function estimateDuration(text){return Math.max(25,Math.round(text.length/3.2))}
function formatTime(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function resetAudio(){clearInterval(timer);timer=null;audioProgress.style.width='0%';audioElapsed.textContent='0:00';totalSeconds=estimateDuration(stories[current].body.join(''));audioDuration.textContent=formatTime(totalSeconds);audioButton.textContent='▶'}
function toggleSpeak(){
  if(speechSynthesis.speaking && !speechSynthesis.paused){speechSynthesis.pause();audioButton.textContent='▶';return}
  if(speechSynthesis.paused){speechSynthesis.resume();audioButton.textContent='Ⅱ';return}
  speak();
}
function speak(){
  stopSpeak();
  const s=stories[current],text=s.body.join('');
  utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-CN';utterance.rate=.92;
  startedAt=Date.now();audioButton.textContent='Ⅱ';
  utterance.onboundary=e=>{if(e.charIndex>=0){const p=Math.min(99,e.charIndex/text.length*100);audioProgress.style.width=p+'%';audioElapsed.textContent=formatTime(totalSeconds*p/100)}};
  utterance.onend=()=>{audioProgress.style.width='100%';audioElapsed.textContent=formatTime(totalSeconds);audioButton.textContent='▶';clearInterval(timer);timer=null};
  utterance.onerror=()=>{audioButton.textContent='▶';clearInterval(timer);timer=null};
  speechSynthesis.speak(utterance);
  clearInterval(timer);
  timer=setInterval(()=>{if(speechSynthesis.speaking&&!speechSynthesis.paused){const p=Math.min(99,(Date.now()-startedAt)/1000/totalSeconds*100);audioProgress.style.width=p+'%';audioElapsed.textContent=formatTime((Date.now()-startedAt)/1000)}},500);
}
function stopSpeak(){speechSynthesis.cancel();clearInterval(timer);timer=null;audioButton.textContent='▶';audioProgress.style.width='0%';audioElapsed.textContent='0:00'}
function toggleLang(){alert('English interface will be added after the Chinese MVP.')}
</script>
</body></html>
